<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clay · PM dispatch approval</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#19293b;font:16px/1.5 system-ui}main{max-width:780px;margin:36px auto;padding:0 16px}section{background:white;border:1px solid #d9e1e8;border-radius:12px;padding:20px;margin:16px 0}.label{color:#0369a1;font-weight:700}h1{font-size:28px;margin:8px 0}h2{font-size:19px}label{display:block;margin:14px 0}input,button{font:inherit;padding:9px}button{background:#075985;color:white;border:0;border-radius:6px;padding:11px 16px;font-weight:600;cursor:pointer}button:disabled{opacity:.5}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:600}#message{font-weight:600}button+button{margin-left:6px}</style></head>
<body><main><div class="label">CLAY · VINAYAK PROCUREMENT</div><h1>PM dispatch approval</h1><p id="ref"></p>
<section id="login"><h2>Open your RFQ review</h2><p id="instructions">Use the private link in your PM WhatsApp message to review this case. No login or code is needed.</p>
<p id="replacement" hidden>To request a fresh link, send <b id="linkRequest"></b> to the staff agent from your registered PM WhatsApp.</p><p><a href="/">Open public dashboard</a></p></section>
<section id="panel" hidden><h2 id="title"></h2><p id="meta"></p><pre id="boq"></pre><div id="drafts"></div>
<form id="approval"><label><input id="check" type="checkbox" required> I have checked the BOQ, recipients and email drafts and approve sending these RFQs.</label><button id="send" disabled>Approve &amp; send vendor emails</button></form>
<p id="receipt"></p><button type="button" id="refresh">Refresh dispatch status</button></section><p id="message" role="status" aria-live="polite"></p></main>
<script id="pm-script">const el=id=>document.getElementById(id),id=location.pathname.split('/')[2];el('ref').textContent='Case '+id;let reviewed=null;
async function api(path,data){const r=await fetch(location.pathname+path,{method:data?'POST':'GET',credentials:'same-origin',cache:'no-store',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error||'Could not complete this step.'),{status:r.status});return j}
async function review(){const d=await api('review');reviewed=d;el('login').hidden=true;el('panel').hidden=false;el('title').textContent=(d.runKey?'Workflow run · ':d.demo?'Demo RFQ · ':'RFQ · ')+d.project+' / '+d.site;el('meta').textContent=d.pm+' · BOQ B'+d.revision+' · Needed '+d.needed+' · Reply by '+d.deadline;el('boq').textContent=d.boq;el('drafts').replaceChildren();for(const v of d.drafts){const box=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=v.id+' · '+v.name+' <'+v.to+'>';p.textContent='Subject: '+v.subject+'\n\n'+v.text;box.append(s,p);el('drafts').append(box)}el('approval').hidden=d.stage!=='BOQ_REVIEW';el('check').checked=false;el('send').disabled=true;el('send').textContent='Approve & send '+d.drafts.length+' vendor emails';el('receipt').textContent=d.receipts.length?d.receipts.map(v=>v.target+': '+v.state).join(' · '):'No vendor email dispatched.'}
function handle(form,fn){el(form).onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;el('message').textContent='Working…';try{await fn(new FormData(e.target))}catch(e){el('message').textContent=e.message}finally{b.disabled=form==='approval'?!el('check').checked:false}}}
el('check').onchange=e=>el('send').disabled=!e.target.checked;
handle('approval',async()=>{const j=await api('approve',{confirm:el('check').checked,revision:reviewed.revision,snapshot:reviewed.snapshot});el('approval').hidden=true;el('message').textContent=j.message;await review()});
el('refresh').onclick=()=>review().catch(e=>el('message').textContent=e.message);
async function start(){const link=new URLSearchParams(location.hash.slice(1)).get('review');if(location.hash)history.replaceState(null,'',location.pathname);
  el('linkRequest').textContent='REVIEWLINK '+id;
  try{await review();return;}catch(e){if(e.status!==401&&e.status!==403)throw e;}
  if(link){await api('open',{link});await review();}else{el('replacement').hidden=false;}}
start().catch(e=>{el('replacement').hidden=false;el('message').textContent=e.message});</script></body></html>
